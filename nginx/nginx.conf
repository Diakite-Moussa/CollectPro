server {
    listen 80;
    server_name dashboard.collectpro.com api.collectpro.com;
    return 301 https://$host$request_uri;
}

# --- Dashboard Angular (fichiers statiques) ---
server {
    listen 443 ssl http2;
    server_name dashboard.collectpro.com;

    # Certbot avec `-d dashboard.collectpro.com -d api.collectpro.com` genere UN SEUL
    # certificat SAN range sous le nom du PREMIER domaine passe : dashboard.collectpro.com
    ssl_certificate /etc/letsencrypt/live/dashboard.collectpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.collectpro.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# --- API Spring Boot Backend (reverse proxy) ---
server {
    listen 443 ssl http2;
    server_name api.collectpro.com;

    # Meme certificat SAN que ci-dessus (couvre aussi api.collectpro.com)
    ssl_certificate /etc/letsencrypt/live/dashboard.collectpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.collectpro.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Le dashboard et le mobile appellent l'API a la racine (ex: /login, /collectes),
    # pas sous /api/, donc on proxy tout le domaine api.collectpro.com vers le backend.
    location / {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
