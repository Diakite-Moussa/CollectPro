# --- Config pour pilote gratuit via ngrok (PC local + tunnel) ---
# ngrok ne fournit qu'UN SEUL domaine statique gratuit, donc on route par CHEMIN
# (path-based) plutot que par nom de domaine : /  = dashboard, /api/ = backend.
# ngrok gere lui-meme le HTTPS cote public, donc nginx n'a plus besoin de SSL ici
# (le trafic ngrok -> PC local se fait en HTTP simple, deja chiffre par ngrok en amont).
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Telechargement de l'APK Android (doit etre servi avant le fallback SPA / try_files,
    # sinon nginx renvoie index.html a la place de l'apk)
    location = /collectpro.apk {
        root /usr/share/nginx/html;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="collectpro.apk"';
    }

    # Front-end Angular Dashboard
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy pour API Spring Boot Backend (prefixe /api/ retire avant transmission)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
