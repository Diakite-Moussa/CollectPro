version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: collectpro_db_prod
    environment:
      POSTGRES_DB: collectepro_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collectpro_backend_prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/collectepro_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      UPLOAD_DIR: /var/collectpro/uploads
    volumes:
      - uploads_data:/var/collectpro/uploads
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:alpine
    container_name: collectpro_nginx_prod
    ports:
      # Port 80 uniquement : ngrok tunnelise ce port et gere le HTTPS public lui-meme.
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/dist/dashboard/browser:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  uploads_data:
